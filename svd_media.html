<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidX Media | SVD Visualizer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-accent: #00f0ff;
            --brand-dark: #020617;
            --surface-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body, html { margin: 0; padding: 0; background-color: var(--brand-dark); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .grid-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; }

        nav { padding: 30px 5vw; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 2px; text-decoration: none; }
        .logo span { color: var(--brand-accent); }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back-link:hover { color: var(--brand-accent); }

        .container { max-width: 1100px; margin: 0 auto; padding: 60px 5vw; }

        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 700; margin: 0 0 10px 0; letter-spacing: -1px; text-align: center; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 1rem; margin-bottom: 50px; letter-spacing: 2px; text-transform: uppercase; }

        /* --- TAB NAVIGATION SYSTEM --- */
        .tab-container { display: flex; gap: 20px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 15px 30px; font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .tab-btn:hover { border-color: rgba(0, 240, 255, 0.4); color: #fff; }
        .tab-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--brand-accent); color: #fff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); }

        .tab-content { display: none; animation: fadeIn 0.5s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- VIDEO WRAPPER --- */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- GITHUB BUTTON --- */
        .github-link { display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 30px; padding: 15px 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-family: 'Space Grotesk', sans-serif; text-decoration: none; border-radius: 8px; font-weight: 600; width: 100%; transition: all 0.3s; box-sizing: border-box; }
        .github-link:hover { background: #fff; color: #000; border-color: #fff; }
        .github-link svg { width: 20px; height: 20px; fill: currentColor; }

        /* --- SIMULATION LAYOUT --- */
        .sim-wrapper { background: #0a0a0a; padding: 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05); border: 1px solid rgba(0, 240, 255, 0.2); }
        .sim-layout { display: flex; gap: 40px; align-items: center; justify-content: center; flex-wrap: wrap; }
        
        input[type="number"] { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 6px; font-size: 1.1rem; text-align: center; box-sizing: border-box; transition: 0.3s; }
        input[type="number"]:focus { outline: none; border-color: var(--brand-accent); }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--brand-accent); }

        .matrices-output { font-family: monospace; background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .matrix-row { margin-bottom: 10px; color: #fff; line-height: 1.4;}
        .matrix-title { color: #888; margin-bottom: 5px; font-size: 0.9rem; font-family: 'Space Grotesk';}
    </style>
</head>
<body>

    <div class="container">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

        <div id="sim1" class="tab-content">

                <div style="text-align: center; font-size: 0.8rem; letter-spacing: 2px; color: #aaa; margin-bottom: 30px;">THE ANATOMY OF TRANSFORMATION</div>

                <div class="sim-layout">
                    
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <canvas id="canvas" width="400" height="400" style="background: #111; border: 1px solid #333; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);"></canvas>
                        <div id="step_text" style="text-align: center; font-weight: bold; color: var(--brand-accent); margin-top: 15px; font-family: 'Space Grotesk';">Original State</div>
                    </div>
                    
                    <div style="flex: 1; min-width: 280px; max-width: 400px;">
                        
                        <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px;">
                            <div class="matrix-title">Transformation Matrix (A)</div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <input type="number" id="m_a" value="1" step="0.1">
                                <input type="number" id="m_b" value="1" step="0.1">
                                <input type="number" id="m_c" value="0" step="0.1">
                                <input type="number" id="m_d" value="2" step="0.1">
                            </div>
                        </div>

                        <div style="background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px;">
                            <div class="matrix-title">Transformation Phase (t)</div>
                            <input type="range" id="t_slider" min="0" max="3" step="0.01" value="0">
                        </div>

                        <div class="matrices-output" id="output">
                            </div>

                    </div>
                </div>
            </div>

            <a href="https://github.com/KRISH9621/Website_/blob/main/svd_simulation.html" target="_blank" class="github-link">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const SCALE = 50; // Pixels per unit adjusted for 400x400

        const inputs = ['m_a', 'm_b', 'm_c', 'm_d'].map(id => document.getElementById(id));
        const slider = document.getElementById('t_slider');
        const stepText = document.getElementById('step_text');
        const outputDiv = document.getElementById('output');

        inputs.forEach(input => input.addEventListener('input', draw));
        slider.addEventListener('input', draw);

        function formatMatrix(name, m, isDiagonal = false) {
            if (isDiagonal) {
                return `<div class="matrix-row"><span style="color:#00f0ff">${name}</span> = <br>[${m[0].toFixed(2)}, 0.00]<br>[0.00, ${m[1].toFixed(2)}]</div>`;
            }
            return `<div class="matrix-row"><span style="color:#00f0ff">${name}</span> = <br>[${m[0][0].toFixed(2)}, ${m[0][1].toFixed(2)}]<br>[${m[1][0].toFixed(2)}, ${m[1][1].toFixed(2)}]</div>`;
        }

        function computeSVD(a, b, c, d) {
            const E = a * a + c * c;
            const F = a * b + c * d;
            const G = b * b + d * d;

            const T = E + G;
            const D = E * G - F * F;
            const diff = Math.sqrt(Math.max(0, T * T - 4 * D));

            let l1 = (T + diff) / 2;
            let l2 = (T - diff) / 2;

            let s1 = Math.sqrt(Math.max(0, l1));
            let s2 = Math.sqrt(Math.max(0, l2));

            let v1x, v1y, v2x, v2y;
            if (Math.abs(F) < 1e-9) {
                v1x = 1; v1y = 0;
                v2x = 0; v2y = 1;
            } else {
                v1x = F;
                v1y = l1 - E;
                let mag = Math.sqrt(v1x * v1x + v1y * v1y);
                v1x /= mag;
                v1y /= mag;
                v2x = -v1y;
                v2y = v1x;
            }

            let u1x, u1y, u2x, u2y;
            if (s1 > 1e-9) {
                u1x = (a * v1x + b * v1y) / s1;
                u1y = (c * v1x + d * v1y) / s1;
            } else {
                u1x = 1; u1y = 0;
            }

            if (s2 > 1e-9) {
                u2x = (a * v2x + b * v2y) / s2;
                u2y = (c * v2x + d * v2y) / s2;
            } else {
                u2x = -u1y; u2y = u1x;
            }

            return {
                U: [[u1x, u2x], [u1y, u2y]],
                S: [s1, s2],
                V: [[v1x, v2x], [v1y, v2y]]
            };
        }

        function transformPoint(p, t, svd) {
            let p0 = { x: p.x, y: p.y };
            
            let p1 = {
                x: svd.V[0][0] * p0.x + svd.V[1][0] * p0.y,
                y: svd.V[0][1] * p0.x + svd.V[1][1] * p0.y
            };
            
            let p2 = {
                x: svd.S[0] * p1.x,
                y: svd.S[1] * p1.y
            };
            
            let p3 = {
                x: svd.U[0][0] * p2.x + svd.U[0][1] * p2.y,
                y: svd.U[1][0] * p2.x + svd.U[1][1] * p2.y
            };

            if (t <= 1) {
                return { x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t };
            } else if (t <= 2) {
                let dt = t - 1;
                return { x: p1.x + (p2.x - p1.x) * dt, y: p1.y + (p2.y - p1.y) * dt };
            } else {
                let dt = t - 2;
                return { x: p2.x + (p3.x - p2.x) * dt, y: p2.y + (p3.y - p2.y) * dt };
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= width; x += SCALE) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for (let y = 0; y <= height; y += SCALE) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();

            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(width / 2, 0); ctx.lineTo(width / 2, height);
            ctx.moveTo(0, height / 2); ctx.lineTo(width, height / 2);
            ctx.stroke();
        }

        function drawVector(p, color, label) {
            const screenX = width / 2 + p.x * SCALE;
            const screenY = height / 2 - p.y * SCALE; 

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(width / 2, height / 2);
            ctx.lineTo(screenX, screenY);
            ctx.stroke();

            const angle = Math.atan2(-p.y, p.x);
            ctx.beginPath();
            ctx.moveTo(screenX, screenY);
            ctx.lineTo(screenX - 10 * Math.cos(angle - Math.PI / 6), screenY - 10 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(screenX - 10 * Math.cos(angle + Math.PI / 6), screenY - 10 * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        }

        function draw() {
            const a = parseFloat(inputs[0].value) || 0;
            const b = parseFloat(inputs[1].value) || 0;
            const c = parseFloat(inputs[2].value) || 0;
            const d = parseFloat(inputs[3].value) || 0;
            const t = parseFloat(slider.value);

            if (t === 0) stepText.innerText = "Original State (Identity)";
            else if (t <= 1) stepText.innerText = `Step 1: First Rotation (V^T) [${Math.round(t*100)}%]`;
            else if (t <= 2) stepText.innerText = `Step 2: Stretch (Sigma) [${Math.round((t-1)*100)}%]`;
            else if (t < 3) stepText.innerText = `Step 3: Final Rotation (U) [${Math.round((t-2)*100)}%]`;
            else stepText.innerText = "Final State (A = U * Sigma * V^T)";

            const svd = computeSVD(a, b, c, d);

            outputDiv.innerHTML = 
                formatMatrix("U", svd.U) +
                formatMatrix("&Sigma; (Sigma)", svd.S, true) +
                formatMatrix("V^T", [[svd.V[0][0], svd.V[1][0]], [svd.V[0][1], svd.V[1][1]]]);

            ctx.clearRect(0, 0, width, height);
            drawGrid();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= 100; i++) {
                const angle = (i / 100) * 2 * Math.PI;
                const p = { x: Math.cos(angle), y: Math.sin(angle) };
                const tP = transformPoint(p, t, svd);
                
                const screenX = width / 2 + tP.x * SCALE;
                const screenY = height / 2 - tP.y * SCALE;

                if (i === 0) ctx.moveTo(screenX, screenY);
                else ctx.lineTo(screenX, screenY);
            }
            ctx.stroke();

            let v_i = transformPoint({ x: 1, y: 0 }, t, svd);
            let v_j = transformPoint({ x: 0, y: 1 }, t, svd);
            drawVector(v_i, '#ff4757', 'i'); 
            drawVector(v_j, '#50fa7b', 'j'); 
        }

        draw();
    </script>
</body>
