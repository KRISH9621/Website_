<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidX | Diagnostic ICP Engine</title>
    <style>
        body {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background-color: #000000;
            color: #f8fafc;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            background-color: #020617;
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            width: 1000px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .top-row {
            display: flex;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
        }

        #simulation-canvas {
            background-color: #000000;
            border-right: 1px solid rgba(0, 240, 255, 0.1);
        }

        .controls-container {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        #btn-step { background: rgba(0, 240, 255, 0.1); color: #00f0ff; border: 1px solid #00f0ff; }
        #btn-step:hover { background: rgba(0, 240, 255, 0.2); }
        
        #btn-auto { background: #00f0ff; color: #000; }
        #btn-auto.active { background: #ff4757; color: #fff; }
        
        #btn-reset { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3); }
        #btn-reset:hover { border-color: #fff; }

        .dashboard-group {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 3px solid #00f0ff;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .stat-label { color: #94a3b8; }
        .stat-value { font-weight: bold; color: #fff; }
        .val-highlight { color: #ff4757; }
        .val-success { color: #50fa7b; }

        /* Graph Section */
        .graph-container {
            padding: 20px;
            background: #000000;
            display: flex;
            flex-direction: column;
        }
        .graph-title {
            color: #94a3b8;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        #graph-canvas {
            width: 100%;
            height: 120px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        .slider-group {
            margin-bottom: 15px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        input[type=range] { width: 100%; accent-color: #00f0ff; }
    </style>
</head>
<body>
    <nav>
        
        <a href="icp.html" class="back-link">← Back to Hub</a>
    </nav>
    <div class="main-container">
        <div class="top-row">
            <canvas id="simulation-canvas" width="550" height="500"></canvas>

            <div class="controls-container">
                <h3 style="margin-top:0; color:#00f0ff;">TrICP Engine Diagnostics</h3>
                
                <div class="button-group">
                    <button id="btn-step">Step Iteration</button>
                    <button id="btn-auto">Auto-Run</button>
                    <button id="btn-reset" style="grid-column: span 2;">Reset Engine</button>
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>Learning Rate (α)</span>
                        <span id="lbl-alpha" style="color:#00f0ff;">0.30</span>
                    </div>
                    <input type="range" id="in-alpha" min="0.05" max="1.0" step="0.05" value="0.30">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span style="color:#ff4757;">Outlier Rejection (%)</span>
                        <span id="lbl-reject" style="color:#ff4757;">10%</span>
                    </div>
                    <input type="range" id="in-reject" min="0" max="40" step="1" value="10">
                </div>

                <div class="dashboard-group">
                    <div class="stat-row">
                        <span class="stat-label">Iteration:</span>
                        <span class="stat-value" id="val-iteration">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Active Error (MSE):</span>
                        <span class="stat-value val-highlight" id="val-error">0.00</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Absolute Best MSE:</span>
                        <span class="stat-value val-success" id="val-best-error">Infinity</span>
                    </div>
                    <div class="stat-row" style="margin-top:10px; border-top:1px solid #333; padding-top:10px;">
                        <span class="stat-label">Engine Status:</span>
                        <span class="stat-value" id="val-status" style="color:#f1c40f;">Ready</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="graph-container">
            <div class="graph-title">
                <span>Loss Curve (MSE over Time)</span>
                <span id="graph-warning" style="color:#ff4757; display:none;">Local Minimum Detected - Halting</span>
            </div>
            <canvas id="graph-canvas" width="960" height="120"></canvas>
        </div>
    </div>

    <script>
        // --- Core Variables ---
        const canvas = document.getElementById('simulation-canvas');
        const ctx = canvas.getContext('2d');
        const gCanvas = document.getElementById('graph-canvas');
        const gCtx = gCanvas.getContext('2d');
        
        const cx = canvas.width / 2, cy = canvas.height / 2;
        
        let targetPoints = [], sourcePoints = [];
        let iter = 0, currentMSE = Infinity;
        
        // Memory & Tracking for Auto-Brake
        let mseHistory = [];
        let bestMSE = Infinity;
        let bestSourceState = [];
        let stallCounter = 0; 
        
        // Settings
        let alpha = 0.30;
        let rejectPercent = 10;
        let autoRunInterval = null;
        const numPoints = 60;

        // UI Elements
        const elIter = document.getElementById('val-iteration');
        const elError = document.getElementById('val-error');
        const elBestError = document.getElementById('val-best-error');
        const elStatus = document.getElementById('val-status');
        const elWarning = document.getElementById('graph-warning');
        const btnAuto = document.getElementById('btn-auto');

        // --- Math Functions (Explicit 2D for Stability) ---
        function calculateMSE(src, tgt) {
            let total = 0;
            src.forEach(sp => {
                let minD = Infinity;
                tgt.forEach(tp => {
                    let d = (sp[0]-tp[0])**2 + (sp[1]-tp[1])**2;
                    if(d < minD) minD = d;
                });
                total += minD;
            });
            return total / src.length;
        }

        // --- Setup ---
        function init() {
            // Target 'C' Shape
            targetPoints = [];
            for(let i=0; i<numPoints; i++) {
                let a = (-150 + (300/numPoints)*i) * (Math.PI/180);
                targetPoints.push([cx + 100*Math.cos(a), cy + 100*Math.sin(a)]);
            }

            // Source Shape (Scrambled)
            let startAngle = (Math.random()*180 - 90) * (Math.PI/180); 
            let cosA = Math.cos(startAngle), sinA = Math.sin(startAngle);
            sourcePoints = targetPoints.map(p => {
                let tx = p[0]-cx, ty = p[1]-cy;
                return [ (tx*cosA - ty*sinA) + cx + 90, (tx*sinA + ty*cosA) + cy - 50 ];
            });

            // Reset Trackers
            iter = 0;
            mseHistory = [];
            bestMSE = Infinity;
            stallCounter = 0;
            bestSourceState = sourcePoints.map(p => [...p]);
            
            currentMSE = calculateMSE(sourcePoints, targetPoints);
            bestMSE = currentMSE;
            mseHistory.push(currentMSE);

            updateUI("Ready");
            elWarning.style.display = 'none';
            drawScene();
            drawGraph();
        }

        // --- Drawing ---
        function drawScene() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            // Target (Blue)
            ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
            targetPoints.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, 7); ctx.fill(); });
            
            // Source (Gold)
            ctx.fillStyle = '#f4a920';
            sourcePoints.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 7); ctx.fill(); });
        }

        function drawGraph() {
            gCtx.clearRect(0,0, gCanvas.width, gCanvas.height);
            if(mseHistory.length < 1) return;

            // Draw Grid
            gCtx.strokeStyle = 'rgba(255,255,255,0.05)';
            gCtx.beginPath();
            gCtx.moveTo(0, gCanvas.height/2); gCtx.lineTo(gCanvas.width, gCanvas.height/2);
            gCtx.stroke();

            // Calculate Scale
            let maxVal = Math.max(...mseHistory) * 1.1;
            if (maxVal === 0) maxVal = 1;
            let dx = gCanvas.width / Math.max(20, mseHistory.length - 1);

            // Draw Line
            gCtx.beginPath();
            gCtx.strokeStyle = '#ff4757';
            gCtx.lineWidth = 2;
            mseHistory.forEach((val, i) => {
                let x = i * dx;
                let y = gCanvas.height - (val / maxVal) * gCanvas.height;
                if(i === 0) gCtx.moveTo(x, y);
                else gCtx.lineTo(x, y);
            });
            gCtx.stroke();
            
            // Draw Dots
            gCtx.fillStyle = '#fff';
            mseHistory.forEach((val, i) => {
                let x = i * dx;
                let y = gCanvas.height - (val / maxVal) * gCanvas.height;
                gCtx.beginPath(); gCtx.arc(x,y, 2, 0, 7); gCtx.fill();
            });
        }

        // --- Core ICP Engine ---
        function stepEngine() {
            // 1. Find Matches
            let matches = [];
            sourcePoints.forEach((sp, i) => {
                let bestD = Infinity, bestJ = -1;
                targetPoints.forEach((tp, j) => {
                    let d = (sp[0]-tp[0])**2 + (sp[1]-tp[1])**2;
                    if(d < bestD) { bestD = d; bestJ = j; }
                });
                matches.push({ srcIdx: i, tgtIdx: bestJ, dist: bestD });
            });

            // 2. Outlier Rejection (TrICP)
            matches.sort((a, b) => a.dist - b.dist);
            let keepCount = Math.floor(sourcePoints.length * (1 - (rejectPercent / 100)));
            if(keepCount < 3) keepCount = 3; 
            let activeMatches = matches.slice(0, keepCount);

            // Calculate active error
            let prevMSE = currentMSE;
            currentMSE = activeMatches.reduce((sum, m) => sum + m.dist, 0) / keepCount;
            mseHistory.push(currentMSE);

            // 3. Track Absolute Best State
            if (currentMSE < bestMSE) {
                bestMSE = currentMSE;
                bestSourceState = sourcePoints.map(p => [...p]); // Deep copy
            }

            // 4. Convergence / Auto-Brake Logic
            let delta = Math.abs(prevMSE - currentMSE);
            
            // If the error barely changes, or actually gets worse, increment stall counter
            if (delta < 0.1 || currentMSE > prevMSE) {
                stallCounter++;
            } else {
                stallCounter = 0; // Reset if we make good progress
            }

            // If we stall for 4 frames, hit the brakes!
            if (stallCounter >= 4) {
                if(autoRunInterval) toggleAuto(); // Stop loop
                
                // RESTORE BEST STATE
                sourcePoints = bestSourceState.map(p => [...p]);
                currentMSE = bestMSE;
                
                updateUI("Converged & Locked");
                elWarning.style.display = 'block';
                elWarning.innerText = currentMSE < 50 ? "Global Minimum Reached - Halting" : "Local Minimum Detected - Halting";
                elWarning.style.color = currentMSE < 50 ? "#50fa7b" : "#ff4757";
                
                drawScene();
                drawGraph();
                return; // End function immediately
            }

            // 5. Compute Transform (Only if not stopped)
            let sC = [0,0], tC = [0,0];
            activeMatches.forEach(m => { 
                sC[0] += sourcePoints[m.srcIdx][0]; sC[1] += sourcePoints[m.srcIdx][1]; 
                tC[0] += targetPoints[m.tgtIdx][0]; tC[1] += targetPoints[m.tgtIdx][1]; 
            });
            sC = [sC[0]/keepCount, sC[1]/keepCount]; 
            tC = [tC[0]/keepCount, tC[1]/keepCount];

            let H = [[0,0],[0,0]];
            activeMatches.forEach(m => {
                let sp = sourcePoints[m.srcIdx]; let tp = targetPoints[m.tgtIdx];
                H[0][0] += (sp[0]-sC[0])*(tp[0]-tC[0]); H[0][1] += (sp[0]-sC[0])*(tp[1]-tC[1]);
                H[1][0] += (sp[1]-sC[1])*(tp[0]-tC[0]); H[1][1] += (sp[1]-sC[1])*(tp[1]-tC[1]);
            });

            // Explicit 2D Procrustes Angle
            let targetTheta = Math.atan2(H[0][1] - H[1][0], H[0][0] + H[1][1]);
            
            // Apply Transform with Learning Rate
            let appliedTheta = targetTheta * alpha;
            let cosT = Math.cos(appliedTheta), sinT = Math.sin(appliedTheta);
            let shiftX = (tC[0] - sC[0]) * alpha, shiftY = (tC[1] - sC[1]) * alpha;

            sourcePoints = sourcePoints.map(p => {
                let cx = p[0] - sC[0], cy = p[1] - sC[1];
                let rx = cosT*cx - sinT*cy;
                let ry = sinT*cx + cosT*cy;
                return [rx + sC[0] + shiftX, ry + sC[1] + shiftY];
            });

            iter++;
            updateUI("Running Optimization...");
            drawScene();
            drawGraph();
        }

        function updateUI(statusText) {
            elIter.innerText = iter;
            elError.innerText = currentMSE.toFixed(2);
            elBestError.innerText = bestMSE.toFixed(2);
            elStatus.innerText = statusText;
            elStatus.style.color = statusText.includes("Locked") ? "#50fa7b" : "#00f0ff";
        }

        function toggleAuto() {
            if (autoRunInterval) {
                clearInterval(autoRunInterval);
                autoRunInterval = null;
                btnAuto.classList.remove('active');
                btnAuto.innerText = "Auto-Run";
                if(stallCounter < 4) updateUI("Paused manually.");
            } else {
                if (stallCounter >= 4) return; // Don't start if already locked
                btnAuto.classList.add('active');
                btnAuto.innerText = "Stop Engine";
                autoRunInterval = setInterval(stepEngine, 50);
            }
        }

        // --- Event Listeners ---
        document.getElementById('btn-step').onclick = () => { if(!autoRunInterval && stallCounter < 4) stepEngine(); };
        btnAuto.onclick = toggleAuto;
        document.getElementById('btn-reset').onclick = () => { if(autoRunInterval) toggleAuto(); init(); };
        
        document.getElementById('in-alpha').oninput = (e) => { 
            alpha = parseFloat(e.target.value); 
            document.getElementById('lbl-alpha').innerText = alpha.toFixed(2); 
        };
        
        document.getElementById('in-reject').oninput = (e) => { 
            rejectPercent = parseInt(e.target.value); 
            document.getElementById('lbl-reject').innerText = `${rejectPercent}%`; 
            if(stallCounter >= 4) {
                // If we were stalled, changing rejection lets us try escaping!
                stallCounter = 0;
                elWarning.style.display = 'none';
                updateUI("Rejection changed. Ready to re-evaluate.");
            }
        };

        // Boot
        init();
    </script>
</body>
</html>
