<head>

    <title>Random Forest Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111114; font-family: system-ui, sans-serif; }
        #info-panel {
            position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(20, 20, 25, 0.85);
            padding: 20px; border-radius: 8px; border: 1px solid #333; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #4facfe; }
        select { width: 100%; padding: 8px; margin-bottom: 15px; background: #222; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer;}
        .instruction { color: #888; font-size: 12px; margin-top: 15px; font-style: italic; }
        .legend-item { display: flex; align-items: center; margin-top: 8px; font-size: 13px; color: #aaa;}
        .color-box { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; }
        
        /* FIX: Ensure the canvas takes up the whole screen */
        #3d-graph { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
    
    <script src="https://unpkg.com/3d-force-graph"></script>
</head>

        <div class="legend-item"><div class="color-box" style="background: #f85149;"></div> Prediction: Heart Disease</div>
        <div class="instruction">✦ Drag nodes to stretch. Scroll to zoom.</div>
    </div>

    <div id="3d-graph"></div>

                    {"source": "T2_1", "target": "T2_5", "condition": "False"}, {"source": "T2_5", "target": "T2_6", "condition": "True"},
                    {"source": "T2_5", "target": "T2_7", "condition": "False"}, {"source": "T2_0", "target": "T2_8", "condition": "False"},
                    {"source": "T2_8", "target": "T2_9", "condition": "True"}, {"source": "T2_9", "target": "T2_10", "condition": "True"},
                    {"source": "T2_9", "target": "T2_11", "condition": "False"}, {"source": "T2_8", "target": "T2_12", "condition": "False"},
                    {"source": "T2_12", "target": "T2_13", "condition": "True"}, {"source": "T2_12", "target": "T2_14", "condition": "False"}
                ]
            }
        ];

        const elem = document.getElementById('3d-graph');
        const selector = document.getElementById('treeSelector');

        // Initialize the Graph
        const Graph = ForceGraph3D()(elem)
            .backgroundColor('#111114')
            .nodeColor(node => {
                if (node.type === "Decision") return '#4facfe';
                if (node.class === "Healthy") return '#2ea043';
                if (node.class === "Heart Disease") return '#f85149';
                return '#888';
            })
            .nodeLabel(node => `
                <div style="background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px; border: 1px solid #333;">
                    <strong style="color: white; font-size: 14px;">${node.type === 'Decision' ? node.rule : node.class}</strong><br>
                    <span style="color:#aaa; font-size:12px;">Type: ${node.type}</span><br>
                    <span style="color:#aaa; font-size:12px;">Samples checked: ${node.samples}</span>
                </div>
            `)
            .nodeVal(node => node.type === "Decision" ? 15 : 8)
            .linkWidth(2)
            .linkOpacity(0.6); // <--- FIX: Chaining stops here!

        // FIX: Physics settings are run independently
        Graph.d3Force('link').distance(80);
        Graph.d3Force('charge').strength(-400);

        Graph.onNodeDragEnd(node => { node.fx = node.x; node.fy = node.y; node.fz = node.z; });

        // FIX: Deep clone the data so switching dropdowns doesn't break the physics engine!
        function loadTree(treeIndex) {
            const freshData = JSON.parse(JSON.stringify(forestData[treeIndex]));
            Graph.graphData(freshData);
        }

        // Listen for dropdown changes
        selector.addEventListener('change', (event) => {
            loadTree(event.target.value);
        });

        // Load the first tree initially
        loadTree(0);
        // FIX: Force the 3D engine to measure the screen exactly
        Graph.width(window.innerWidth);
        Graph.height(window.innerHeight);

        // FIX: Make it responsive so if you resize your browser window, the 3D graph resizes with it!
        window.addEventListener('resize', () => {
            Graph.width(window.innerWidth);
            Graph.height(window.innerHeight);
        });
    </script>
</body>
</html>
